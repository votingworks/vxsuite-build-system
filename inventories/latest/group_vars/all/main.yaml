repos:
  vxsuite-complete-system:
    version: main
#-- Optionally override the vxsuite version used in the build. vxsuite is
#-- normally pinned by the vxsuite-complete-system submodule; when this is
#-- set, the vxsuite subdirectory is fetched and checked out at the given
#-- branch/tag/commit after the clone and submodule update.
# vxsuite_version_override: main
virt_image_path: "/var/lib/libvirt/images"
vm_name: "debian-latest"
vm_disk_size_gb: 27
iso_version: "12.2.0"
iso_name: "debian-{{ iso_version }}-amd64-netinst.iso"
iso_url: "https://cdimage.debian.org/cdimage/archive/{{ iso_version }}/amd64/iso-cd"
vm_preseed_path: "/home/{{ ansible_env.SUDO_USER }}/code/vxsuite-build-system/preseeds"
vm_preseed_file: "production-preseed.cfg"
secure_boot: true
rust_version: "1.98.0"
qa_image: true
cloned_images:
  - online
