---
#-- The DeskPro driver is private: scripts/tb-fetch-deskpro-driver.sh supplies AWS
#-- credentials for the download, and setup-machine.sh installs the staged copy.
- name: Download and stage the DeskPro driver
  hosts: 127.0.0.1
  connection: local
  become: true

  vars:
    deskpro_driver_staged_path: "/opt/deskpro-driver.tar.gz"
    deskpro_driver_disabled_marker: "/opt/deskpro-driver.disabled"

  tasks:

    - import_tasks: shared_tasks/user_to_configure.yaml
    - import_tasks: shared_tasks/well_known_paths.yaml

    - name: Require an explicit DeskPro driver configuration
      ansible.builtin.assert:
        that:
          - deskpro_driver is defined
          - deskpro_driver.enabled is defined
          - deskpro_driver.enabled is boolean
          - not deskpro_driver.enabled or (deskpro_driver.url is defined and deskpro_driver.checksum is defined)
        fail_msg: >-
          Set deskpro_driver in the inventory to either `{enabled: false}` or
          `{enabled: true, url: ..., checksum: <sha256>}`, plus `s3_region` if the URL needs AWS credentials.

    - name: Download, verify, and stage the DeskPro driver
      when: deskpro_driver.enabled
      block:

        - name: Define the DeskPro driver download path
          set_fact:
            deskpro_driver_download_path: "{{ well_known_paths['tools']['system_path'] }}/deskpro/{{ deskpro_driver.url | urlsplit('path') | basename }}"

        - name: Ensure the DeskPro download directory exists
          ansible.builtin.file:
            path: "{{ deskpro_driver_download_path | dirname }}"
            state: directory
            mode: 0755
          tags:
            - online

        - name: Check for an existing DeskPro driver download
          ansible.builtin.stat:
            path: "{{ deskpro_driver_download_path }}"
            checksum_algorithm: sha256
          register: deskpro_driver_existing
          tags:
            - online

        - name: Download the DeskPro driver
          when: not deskpro_driver_existing.stat.exists or deskpro_driver_existing.stat.checksum != deskpro_driver.checksum
          tags:
            - online
          block:

            - name: Require AWS credentials for an S3 download
              ansible.builtin.assert:
                that:
                  - lookup('env', 'AWS_ACCESS_KEY_ID') | length > 0
                  - lookup('env', 'AWS_SECRET_ACCESS_KEY') | length > 0
                fail_msg: "AWS credentials are required to download the DeskPro driver. Run scripts/tb-fetch-deskpro-driver.sh."
              when: deskpro_driver.s3_region is defined

            # Credentials go to curl on stdin so they never appear in the process list.
            - name: Download the DeskPro driver with curl
              ansible.builtin.command:
                argv: "{{ ['curl', '--fail', '--silent', '--show-error', '--config', '-', '--output', deskpro_driver_download_path]
                  + (['--aws-sigv4', 'aws:amz:' ~ deskpro_driver.s3_region ~ ':s3', '--header', 'x-amz-content-sha256: UNSIGNED-PAYLOAD'] if deskpro_driver.s3_region is defined else [])
                  + [deskpro_driver.url] }}"
                stdin: |
                  {% if deskpro_driver.s3_region is defined %}
                  user = "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}:{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
                  {% if lookup('env', 'AWS_SESSION_TOKEN') %}
                  header = "x-amz-security-token: {{ lookup('env', 'AWS_SESSION_TOKEN') }}"
                  {% endif %}
                  {% endif %}
              register: deskpro_driver_curl
              failed_when: false
              no_log: true

            - name: Report a failed DeskPro driver download
              ansible.builtin.fail:
                msg: "Downloading the DeskPro driver failed: {{ deskpro_driver_curl.stderr }}"
              when: deskpro_driver_curl.rc != 0

        - name: Checksum the DeskPro driver
          ansible.builtin.stat:
            path: "{{ deskpro_driver_download_path }}"
            checksum_algorithm: sha256
          register: deskpro_driver_download

        - name: Verify the DeskPro driver checksum
          ansible.builtin.assert:
            that:
              - deskpro_driver_download.stat.exists
              - deskpro_driver_download.stat.checksum == deskpro_driver.checksum
            fail_msg: "{{ deskpro_driver_download_path }} is missing or does not match the expected checksum."

        - name: Stage the DeskPro driver for setup-machine.sh
          ansible.builtin.copy:
            src: "{{ deskpro_driver_download_path }}"
            dest: "{{ deskpro_driver_staged_path }}"
            remote_src: true
            owner: root
            group: root
            mode: 0644
          tags:
            - offline

    - name: Remove the stale DeskPro driver state
      ansible.builtin.file:
        path: "{{ deskpro_driver_disabled_marker if deskpro_driver.enabled else deskpro_driver_staged_path }}"
        state: absent
      tags:
        - offline

    - name: Mark DeskPro support as disabled for setup-machine.sh
      ansible.builtin.copy:
        content: ""
        dest: "{{ deskpro_driver_disabled_marker }}"
        owner: root
        group: root
        mode: 0644
      when: not deskpro_driver.enabled
      tags:
        - offline
